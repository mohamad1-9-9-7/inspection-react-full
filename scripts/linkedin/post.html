// Deterministic QR-looking pattern (decorative only).
function qr(size, cell) {
  let s = 7, out = "";
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => (x < 7 && y < 7) || (x >= size - 7 && y < 7) || (x < 7 && y >= size - 7);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let on;
    if (finder(x, y)) {
      const fx = x >= size - 7 ? x - (size - 7) : x, fy = y >= size - 7 ? y - (size - 7) : y;
      on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
    } else on = rnd() > 0.52;
    if (on) out += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`;
  }
  return `<svg viewBox="0 0 ${size * cell} ${size * cell}" width="${size * cell}" height="${size * cell}" fill="#0B1E3F">${out}</svg>`;
}
