[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  PUBLIC_URL = "/"
  # The build ran out of memory on Netlify (Oct 2026, after three.js + the
  # barcode reader joined the bundle): Node's default heap (~2 GB) is not
  # enough for react-scripts with source maps. No production source maps
  # (the main memory cost — same as the local .env) and a 4 GB heap.
  GENERATE_SOURCEMAP = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[redirects]]
  from = "/api/*"
  to = "https://inspection-server-4nvj.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
